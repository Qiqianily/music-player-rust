name: ⚙️ Rust CI/CD Pipeline

# 触发条件：master 分支推送或拉取请求，以及标签推送
on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:
    branches:
      - master

# 全局权限设置（仅在需要时启用更细粒度控制）
permissions:
  contents: read

# ✅ 统一在这里定义二进制名，所有 job 通过 ${{ env.BINARY }} 引用
#    ⚠️ 必须与 Cargo.toml 中 [package].name 或 [[bin]].name 完全一致
env:
  BINARY: player

jobs:
  # ============================================================
  # Job 1: Lint 检查（格式、静态分析）
  # ============================================================
  lint:
    name: 🤖 Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 🔧 Install Rust stable
        run: rustup toolchain install stable

      - name: 🧹 Format check
        run: cargo fmt -- --check

      - name: 🛠️ Clippy static analysis
        run: cargo clippy --all-targets --all-features --tests --benches -- -D warnings

  #      - name: 🛠️ Install cargo-audit
  #        run: cargo install cargo-audit
  #
  #      - name: 🔍 Audit dependencies for vulnerabilities
  #        run: cargo audit

  # ============================================================
  # Job 2: 测试执行
  # ============================================================
  test:
    name: 🧪 Run Tests
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 🔧 Install Rust stable
        run: rustup toolchain install stable --component llvm-tools-preview

      - name: 🧪 Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: 🧪 Install nextest
        uses: taiki-e/install-action@nextest

      - name: 📦 Restore cache
        uses: Swatinem/rust-cache@v2

      - name: 🧪 Run tests with coverage
        run: |
          cargo nextest run --all-features
    #          cargo llvm-cov --lcov --output-path lcov.info

    #      - name: 📤 Upload coverage to Codecov
    #        uses: codecov/codecov-action@v5
    #        with:
    #          file: ./lcov.info

    # ============================================================
    # Job 3: 构建二进制文件（带缓存和多平台支持）
    # ============================================================
  build:
    name: 🚀 Build Binary
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 🔧 Install Rust stable
        run: rustup toolchain install stable

      - name: 📦 Restore cache
        uses: Swatinem/rust-cache@v2

      - name: 🏗️ Build release binary
        run: cargo build --release

      # ✅ 把二进制重命名为「BINARY-平台[.exe]」放到 dist/ 下
      #    这样三个平台的产物文件名不会冲突，Release 里一眼可辨
      # - name: 📦 Stage binary with platform suffix
      #   shell: bash
      #   run: |
      #     mkdir -p dist
      #     src="target/release/${{ env.BINARY }}"
      #     if [ -f "${src}.exe" ]; then
      #       # Windows 平台
      #       cp "${src}.exe" "dist/${{ env.BINARY }}-${{ matrix.platform }}.exe"
      #     else
      #       # Linux / macOS 平台
      #       cp "$src" "dist/${{ env.BINARY }}-${{ matrix.platform }}"
      #     fi
      #     echo "--- staged files ---"
      #     ls -l dist/

      - name: 📦 Package binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          # 精确指定源文件，不用通配符，避免 .pdb/.d/.dSYM 混入
          if [ -f "target/release/${{ env.BINARY }}.exe" ]; then
            src="target/release/${{ env.BINARY }}.exe"
            bin="${{ env.BINARY }}.exe"
          else
            src="target/release/${{ env.BINARY }}"
            bin="${{ env.BINARY }}"
          fi

          [ -f "$src" ] || { echo "binary not found: $src"; exit 1; }

          cp "$src" "dist/$bin"

          # 按 runner.os 决定后缀，打包到 dist/ 内
          case "${{ runner.os }}" in
            Windows)  suffix="windows" ;;
            macOS)    suffix="macos" ;;
            Linux)    suffix="linux" ;;
            *)        echo "unknown OS"; exit 1 ;;
          esac

          tar -czf "dist/${{ env.BINARY }}-${suffix}.tar.gz" -C dist "$bin"
          rm "dist/$bin"   # 只想发压缩包就删裸文件；想两个都发就注释掉

          echo "--- staged files ---"
          ls -lh dist/

      - name: 📁 Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY }}-${{ matrix.platform }}
          path: dist/
          # 如果 BINARY 配错、文件不存在，直接报错而不是静默成功
          if-no-files-found: error

    # Job 4: 文档构建与部署（docs.rs 风格）
  #  docs:
  #      name: 📚 Build and Deploy Docs
  #      runs-on: ubuntu-latest
  #      steps:
  #        - name: 📂 Checkout code
  #          uses: actions/checkout@v7
  #          with:
  #            fetch-depth: 0
  #            submodules: recursive
  #
  #        - name: 🔧 Install Rust stable
  #          run: rustup toolchain install stable
  #
  #        - name: 📘 Build documentation
  #          run: cargo doc --no-deps
  #
  #        - name: 🚀 Deploy docs to GitHub Pages
  #          uses: peaceiris/actions-gh-pages@v3
  #          with:
  #            github_token: ${{ secrets.GITHUB_TOKEN }}
  #            publish_dir: ./target/doc

  # ============================================================
  # Job 5: 发布版本（当打 tag 时触发）
  # ============================================================
  release:
    name: 🚀 Create GitHub Release
    needs: [test, lint]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: 📜 Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git_cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md

      - name: 📦 Download artifacts (from build job)
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      # ✅ 新增：打包包含 submodule 的完整源码
      #    排除 .git、target、dist 等无关/体积大的目录
      - name: 📚 Package full source (with submodules)
        run: |
          mkdir -p artifacts/source
          tar -czf "artifacts/source/${{ env.BINARY }}-${{ github.ref_name }}-source.tar.gz" \
            --exclude='./.git' \
            --exclude='./target' \
            --exclude='./dist' \
            --exclude='./artifacts' \
            -C "${{ github.workspace }}" .

      - name: 📋 List downloaded assets
        run: |
          echo "--- release assets ---"
          find artifacts -type f -exec ls -l {} \;

      - name: 📦 Upload release to GitHub
        uses: softprops/action-gh-release@v3
        with:
          # 发布标题为 tag 名
          body: ${{ steps.git_cliff.outputs.content }}
          # 递归匹配 artifacts 下所有文件，直接作为 Release 资产
          files: |
            artifacts/**/*

